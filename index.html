<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique Search Experience</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animated Blobs */
    .blob {
      position: absolute;
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      filter: blur(80px);
      border-radius: 50%;
      z-index: -1;
      animation: move 20s infinite alternate;
    }
    @keyframes move {
      from { transform: translate(-10%, -10%); }
      to { transform: translate(20%, 20%); }
    }
    
    /* Glass Effect */
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-[#0f172a] min-h-screen overflow-x-hidden flex flex-col items-center py-12 px-4">

  <div class="blob top-0 left-0 opacity-30"></div>
  <div class="blob bottom-0 right-0 opacity-20" style="animation-delay: -5s; background: #22d3ee;"></div>

  <div class="w-full max-w-2xl mb-12 text-center">
    <h1 class="text-5xl font-black text-white mb-6 tracking-tighter">
      Explore <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Everything.</span>
    </h1>
    
    <div class="relative group">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search for magic..." 
        class="w-full px-8 py-5 bg-white/10 glass rounded-2xl text-white text-xl outline-none focus:ring-2 focus:ring-purple-500/50 transition-all placeholder-gray-400"
      >
      <div class="absolute right-6 top-5 text-gray-400 group-focus-within:text-purple-400 transition-colors">
        <kbd class="hidden sm:inline-block px-2 py-1 bg-gray-700 rounded text-xs">CTRL + K</kbd>
      </div>
    </div>
  </div>

  <div id="container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-6xl">
    </div>
<script src="script.js"></script>
 
</body>
</html>
